name: Tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
jobs:
  unit:
    runs-on: ubuntu-latest
    name: unit (${{ matrix.node-version || '.tool-versions' }})
    strategy:
      matrix:
        # The least Node.js the tests run on, and the one the repository is developed on
        include:
          - node-version: 22
          - node-version-file: .tool-versions
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test:unit
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint files
        run: pnpm lint
